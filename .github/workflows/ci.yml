name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        run: |
          go build ./cmd/auth
          go build ./cmd/outbox
          go build ./cmd/vk-consumer

      - name: Run tests
        run: go test -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum
          cache: true

      - name: Run tests with coverage
        run: |
          mkdir -p .coverage
          go test -short -count=1 -covermode=atomic -coverprofile=.coverage/coverage.out ./...

      - name: Print total coverage
        run: go tool cover -func=.coverage/coverage.out | tee .coverage/coverage.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage/

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum
          cache: true

      - name: Run race detector
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
      STATICCHECK_CACHE: /tmp/staticcheck-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum
          cache: true

      - name: Check formatting
        run: |
          files="$(find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" -checks='all,-SA1019,-ST*' ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOFLAGS=-mod=vendor govulncheck ./...

  postgres-migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: goose -dir=migrations/postgres postgres "$DATABASE_URL" up

      - name: Check migration status
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: goose -dir=migrations/postgres postgres "$DATABASE_URL" status

      - name: Check down/up consistency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          goose -dir=migrations/postgres postgres "$DATABASE_URL" down-to 0
          goose -dir=migrations/postgres postgres "$DATABASE_URL" up

  clickhouse-migrations:
    name: ClickHouse Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ClickHouse stack
        run: |
          docker compose \
            -f ./deployment/docker-compose.kafka.yaml \
            -f ./deployment/docker-compose.clickhouse.yaml \
            up -d zookeeper kafka schema-registry kafka-init clickhouse

      - name: Wait for ClickHouse
        run: |
          for i in {1..60}; do
            if docker compose \
              -f ./deployment/docker-compose.kafka.yaml \
              -f ./deployment/docker-compose.clickhouse.yaml \
              exec -T clickhouse clickhouse-client --query "SELECT 1"; then
              exit 0
            fi
            sleep 2
          done
          docker compose \
            -f ./deployment/docker-compose.kafka.yaml \
            -f ./deployment/docker-compose.clickhouse.yaml \
            logs clickhouse
          exit 1

      - name: Re-apply ClickHouse migrations
        run: |
          for migration in migrations/clickhouse/*.sql; do
            docker compose \
              -f ./deployment/docker-compose.kafka.yaml \
              -f ./deployment/docker-compose.clickhouse.yaml \
              exec -T clickhouse clickhouse-client --multiquery < "$migration"
          done

      - name: Stop ClickHouse stack
        if: always()
        run: |
          docker compose \
            -f ./deployment/docker-compose.kafka.yaml \
            -f ./deployment/docker-compose.clickhouse.yaml \
            down -v

  manifests:
    name: Manifests And Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: |
          docker compose \
            -f ./deployment/docker-compose.database.yaml \
            -f ./deployment/docker-compose.kafka.yaml \
            -f ./deployment/docker-compose.clickhouse.yaml \
            -f ./deployment/docker-compose.tracing.yaml \
            -f ./deployment/docker-compose.app.yaml \
            config --quiet

      - name: Validate Kubernetes manifests
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -summary -ignore-missing-schemas deploy/minikube/*.yaml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build auth image
        run: docker build -f deployment/auth/Dockerfile .

      - name: Build goose image
        run: docker build -f deployment/goose/Dockerfile .
