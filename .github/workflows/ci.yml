name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        run: |
          go build ./cmd/auth
          go build ./cmd/outbox
          go build ./cmd/vk-consumer

      - name: Run tests
        run: go test -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: |
          mkdir -p .coverage
          go test -count=1 -covermode=atomic -coverprofile=.coverage/coverage.out ./...

      - name: Print total coverage
        run: go tool cover -func=.coverage/coverage.out | tee .coverage/coverage.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage/

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOFLAGS=-mod=vendor govulncheck ./...

  postgres-migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: goose -dir=migrations/postgres postgres "$DATABASE_URL" up

      - name: Check migration status
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: goose -dir=migrations/postgres postgres "$DATABASE_URL" status

      - name: Check down/up consistency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          goose -dir=migrations/postgres postgres "$DATABASE_URL" down-to 0
          goose -dir=migrations/postgres postgres "$DATABASE_URL" up

  clickhouse-migrations:
    name: ClickHouse Migrations
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ClickHouse migrations
        run: |
          python3 <<'PY'
          import pathlib
          import urllib.error
          import urllib.request

          def apply_sql(path: pathlib.Path) -> None:
              sql = path.read_text()
              for index, statement in enumerate(part.strip() for part in sql.split(";") if part.strip()):
                  print(f"Applying {path} statement {index + 1}", flush=True)
                  request = urllib.request.Request(
                      "http://localhost:8123/",
                      data=(statement + ";").encode(),
                      method="POST",
                  )
                  try:
                      urllib.request.urlopen(request, timeout=30).read()
                  except urllib.error.HTTPError as err:
                      print(err.read().decode(), flush=True)
                      raise

          for migration in sorted(pathlib.Path("migrations/clickhouse").glob("*.sql")):
              apply_sql(migration)
          PY

      - name: Re-apply ClickHouse migrations
        run: |
          python3 <<'PY'
          import pathlib
          import urllib.error
          import urllib.request

          def apply_sql(path: pathlib.Path) -> None:
              sql = path.read_text()
              for index, statement in enumerate(part.strip() for part in sql.split(";") if part.strip()):
                  print(f"Re-applying {path} statement {index + 1}", flush=True)
                  request = urllib.request.Request(
                      "http://localhost:8123/",
                      data=(statement + ";").encode(),
                      method="POST",
                  )
                  try:
                      urllib.request.urlopen(request, timeout=30).read()
                  except urllib.error.HTTPError as err:
                      print(err.read().decode(), flush=True)
                      raise

          for migration in sorted(pathlib.Path("migrations/clickhouse").glob("*.sql")):
              apply_sql(migration)
          PY

  manifests:
    name: Manifests And Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: |
          docker compose \
            -f ./deployment/docker-compose.database.yaml \
            -f ./deployment/docker-compose.kafka.yaml \
            -f ./deployment/docker-compose.clickhouse.yaml \
            -f ./deployment/docker-compose.tracing.yaml \
            -f ./deployment/docker-compose.app.yaml \
            config --quiet

      - name: Validate Kubernetes manifests
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -summary -ignore-missing-schemas deploy/minikube/*.yaml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build auth image
        run: docker build -f deployment/auth/Dockerfile .

      - name: Build goose image
        run: docker build -f deployment/goose/Dockerfile .
