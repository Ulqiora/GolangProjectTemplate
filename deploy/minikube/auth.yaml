apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: auth-local
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 10000
      targetPort: grpc
    - name: http
      port: 10001
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
    - name: profiler
      port: 6060
      targetPort: profiler
  selector:
    app: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      enableServiceLinks: false
      containers:
        - name: auth
          image: auth-service:local
          imagePullPolicy: Never
          args:
            - /app/configs/auth/docker.yaml
          ports:
            - name: grpc
              containerPort: 10000
            - name: http
              containerPort: 10001
            - name: metrics
              containerPort: 9090
            - name: profiler
              containerPort: 6060
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
